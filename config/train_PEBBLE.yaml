defaults:
    - agent: sac
    
# this needs to be specified manually
experiment: PEBBLE

# reward learning
segment: 50
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 5000
num_interact: 5000
reward_lr: 0.0003
reward_batch: 128
reward_update: 200
feed_type: 1
reset_update: 100
topK: 5
ensemble_size: 3
max_feedback: 1400
large_batch: 10
label_margin: 0.0
teacher_beta: -1
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0

rm_reset: false

# Gauge-ambiguity experiment
# [Gauge experiment, Step 1] Controls RM optimizer regularization and post-step
# projection.  "none": wd=0 (BPref default, no gauge fixing — baseline for C6)
# "l2": Adam weight_decay=1e-4  "zero_mean_ref": wd=0 + zero-mean projection
# on frozen reference segments collected at first RM training event.
# Default "none" preserves backward compatibility with BPref's original behavior.
gauge_mode: none

# Post-hoc gauge experiment controls
enable_gauge_experiment: false
method: rrm                 # rrm | pg_rlhf
gauge: none                 # none | mean_buf | mean_ref | no_tanh | no_tanh_mean_buf | no_tanh_mean_ref
alpha_mode: auto            # auto | low | high
use_perf_correction: false
n_ref: 10000
reference_seed: 0
n_shift_sample: 2048
gauge_check_atol: 1e-4
reference_dataset_dir: reference_dataset
k_perf: 20
perf_n_traj: 1
h_horizon: 1000
pref_subsample: 64
replay_subsample: 256
cg_iter: 8
eps_ridge: 1e-3
perf_max_grad_norm: 10.0

# How often (in env steps) to log gauge diagnostics during the policy-training
# phase.  Used by train_PEBBLE_oneshot.py; ignored by the iterative script.
gauge_diag_frequency: ${eval_frequency}

# scheduling
reward_schedule: 0

num_train_steps: 1e6
replay_buffer_capacity: ${num_train_steps}

# evaluation config
eval_frequency: 10000
num_eval_episodes: 10
gpu: 0
device: cuda:${gpu}

# dormant neuron tracking
dormant_log_period: 5000
dormant_threshold: 0.1

# BT weight / gradient norm logging
bt_log_period: 5000
log_extra_metrics: false

# logger
log_frequency: 10000
log_save_tb: true
use_wandb: false
wandb_project: performative-correction

# video recorder
save_video: false

# setups
seed: 1

# Tandem experiment
# tandem_mode: baseline | all_passive | passive_pol_active_rm |
#              active_pol_passive_rm | active_pol_passive_query | active_pol_passive_dist
tandem_mode: baseline
# Directory where baseline HDF5 logs are stored.
# Override with tandem_log_dir=/your/path on any machine.
tandem_log_dir: ${exp_dir}/tandem_logs
# Explicit path override (optional).  If null, auto-derived as
# {tandem_log_dir}/tandem_baseline_{env}_seed{seed}.h5
tandem_log_path: null
# Set to true to enable SC2/SC3 routing invariant checks every sanity_check_interval steps.
sanity_mode: false
sanity_check_interval: 2000

# Environment
env: dog_stand
gradient_update: 1

# Base output directory (override on CLI with exp_dir=/your/path)
exp_dir: /home/zifan/NoisyPbRL/exp

# hydra configuration
hydra:
    name: ${env}
    run:
        dir: ${exp_dir}/${env}/H${diag_gaussian_actor.params.hidden_dim}_L${diag_gaussian_actor.params.hidden_depth}_lr${agent.params.actor_lr}/teacher_b${teacher_beta}_g${teacher_gamma}_m${teacher_eps_mistake}_s${teacher_eps_skip}_e${teacher_eps_equal}/label_smooth_${label_margin}/schedule_${reward_schedule}/tandem_${tandem_mode}/gauge_${gauge_mode}/${experiment}_init${num_seed_steps}_unsup${num_unsup_steps}_inter${num_interact}_maxfeed${max_feedback}_seg${segment}_act${activation}_Rlr${reward_lr}_Rbatch${reward_batch}_Rupdate${reward_update}_en${ensemble_size}_sample${feed_type}_large_batch${large_batch}_rm${rm_reset}_seed${seed}