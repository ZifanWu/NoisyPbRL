# PG-RLHF experiment.
#
# Compares Standard SAC vs PG-RLHF SAC under the same Tier B mis-condition.
# Three methods (one per Hydra job via `method=`):
#   - standard : θ ← θ + α·g0           (no correction)
#   - pg_fd    : θ ← θ + α·g0 + α·g_perp_FD  (FD g_perp recomputed every K)
#   - pg_hvp   : θ ← θ + α·g0 + α·g_perp_HVP (HVP+CG g_perp recomputed every K)
#
# g_perp is cached for `pg_fresh_refit_every` actor updates between refreshes.

defaults:
    - agent: sac_metaworld

experiment: PEBBLE_pg_rlhf

segment: 50
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 9000
num_interact: 10000
reward_lr: 0.0003
reward_batch: 50
reward_update: 10
feed_type: 0
reset_update: 100
topK: 5
ensemble_size: 5
max_feedback: 2000
large_batch: 10
label_margin: 0.0
teacher_beta: 5
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0
bt_normalize_by_gap_std: true
bt_gap_ema_alpha: 0.9

rm_reset: false
reward_schedule: 0

num_train_steps: 750000
replay_buffer_capacity: ${num_train_steps}

eval_frequency: 10000
num_eval_episodes: 10
gpu: 0
device: cuda:${gpu}

dormant_log_period: 5000
dormant_threshold: 0.1
bt_log_period: 5000

log_frequency: 10000
log_save_tb: true
use_wandb: false

save_video: false
seed: 1
env: metaworld_door-open-v2
gradient_update: 1

rm_hidden_dim: 16
rm_num_layers: 1
rm_output_activation: tanh

buffer_window_rounds: 3

yardstick_hidden_dim: null
yardstick_num_layers: null
yardstick_output_activation: null

monitor_frequency: 20000
probe_seg_size: 200
probe_size: 1024
kappa_warmup_steps: 10
kappa_fresh_prefs: 64
checkpoint_step: 500000

# ---- PG-RLHF-specific knobs ----
method: standard               # one of {standard, pg_fd, pg_hvp}
pg_fresh_refit_every: 1000     # recompute g_perp every K actor updates
pg_pref_batch_size: 128
pg_fd_refit_epochs: 10
pg_hvp_ridge: 0.01
pg_hvp_cg_iters: 10
pg_correction_scale: 1.0       # multiplier on g_perp before adding to actor step
pg_clip_norm: 1.0              # trust-region cap on ‖g_perp‖ after scaling (set <=0 to disable)

hydra:
    name: ${env}
    run:
        dir: /home/zifan/NoisyPbRL/exp/axis2_dynamics_pg/pg_rlhf/${env}/${method}/seed${seed}
